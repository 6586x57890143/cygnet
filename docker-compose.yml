# Local development: bot + Postgres. `docker compose up --build`.
services:
  bot:
    build: .
    env_file: .env
    environment:
      CYGNET_DATABASE_URL: postgres://cygnet:cygnet@postgres:5432/cygnet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cygnet
      POSTGRES_PASSWORD: cygnet
      POSTGRES_DB: cygnet
    ports:
      - "127.0.0.1:${CYGNET_PG_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygnet"]
      interval: 5s
