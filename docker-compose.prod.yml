# Pinned, not taken from the directory name: the volume is always
# cygnet_pgdata, so a deploy from any other directory (a new host, a renamed
# checkout) finds the same database instead of silently starting an empty one.
name: cygnet

services:
  bot:
    # Pinned to the exact commit CI built. Rollback, on foundry as deploy:
    #   cd ~/cygnet && cp previous-tag.env deployed-tag.env
    #   set -a; . ./deployed-tag.env; set +a
    #   docker compose -f docker-compose.prod.yml up -d
    image: ghcr.io/6586x57890143/cygnet:${CYGNET_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Also what makes an intent change in the Developer Portal take effect:
    # cygnet exits cleanly when it sees one and comes back re-identified.
    # The hub listens on the fleet network only, as cygnet:7700. Nothing is
    # published to the host. The other birds join the same network.
    networks:
      default:
      fleet:
        aliases: [cygnet]
    restart: unless-stopped
    # A deploy stops the old bot with SIGTERM: the birds hear goaway and
    # relink to the new one.
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: cygnet
    volumes:
      # 18+ keeps its data in a versioned directory under this mount.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:

# Shared by the birds, made once on the host: docker network create fleet
# (both deploy paths do it when it is missing).
networks:
  fleet:
    external: true
