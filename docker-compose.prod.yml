# Pinned, not taken from the directory name: the volume is always
# cygnet_pgdata, so a deploy from any other directory (a new host, a renamed
# checkout) finds the same database instead of silently starting an empty one.
name: cygnet

services:
  bot:
    # Pinned to the exact commit CI built. Rollback, on foundry as deploy:
    #   cd ~/cygnet && cp previous-tag.env deployed-tag.env
    #   set -a; . ./deployed-tag.env; set +a
    #   docker compose -f docker-compose.prod.yml up -d
    image: ghcr.io/6586x57890143/cygnet:${CYGNET_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    # The read-only Docker proxy below, for checking a bird's container
    # runs the image its CI signed (internal/hub/host.go).
    environment:
      CYGNET_DOCKER: ${CYGNET_DOCKER:-http://docker:2375}
    depends_on:
      postgres:
        condition: service_healthy
    # Also what makes an intent change in the Developer Portal take effect:
    # cygnet exits cleanly when it sees one and comes back re-identified.
    # The hub listens on the fleet network only, as cygnet:7700. Nothing is
    # published to the host. The other birds join the same network.
    networks:
      default:
      dockerapi:
      fleet:
        aliases: [cygnet]
    restart: unless-stopped
    # A deploy stops the old bot with SIGTERM: the birds hear goaway and
    # relink to the new one.
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: cygnet
    volumes:
      # 18+ keeps its data in a versioned directory under this mount.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
    restart: unless-stopped
    mem_limit: 256m

  # The way in for cygnet.lol's Worker, and for a bird on another host: an
  # outbound connection to Cloudflare, so nothing listens on foundry. Its
  # hostname answers only to Access's service token and reaches the hub as
  # cygnet:7700 on the fleet network (docs/edge.md, The tunnel). Started
  # only with COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in .env, and given
  # nothing else from it.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - fleet
    read_only: true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 128m

  # What cygnet reads of the Docker daemon: the containers and images on
  # this host, nothing else and nothing written (POST is off, and every
  # section but CONTAINERS and IMAGES is closed). Only on dockerapi, an
  # internal network with cygnet alone on it, so no bird reaches it.
  docker:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerapi
    read_only: true
    tmpfs:
      - /run
      - /tmp
    restart: unless-stopped
    mem_limit: 64m

volumes:
  pgdata:

# Shared by the birds, made once on the host: docker network create fleet
# (both deploy paths do it when it is missing).
networks:
  fleet:
    external: true
  dockerapi:
    internal: true
