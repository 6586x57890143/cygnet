# Optional override; the normal deployment does not load or enable this.
# Use a reviewed image pinned by digest with the official wallet RPC binary
# at /usr/local/bin/monero-wallet-rpc. See docs/monero.md before enabling.
services:
  bot:
    networks:
      xmr: {}
    volumes:
      - ./secrets/xmr-rpc-password:/run/secrets/xmr-rpc-password:ro

  xmr-wallet:
    image: ${CYGNET_XMR_IMAGE:?set an immutable reviewed wallet image}
    user: "65532:65532"
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command: ["--config-file", "/run/secrets/xmr-wallet.conf"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./xmr-wallet:/wallet
      - ./secrets/xmr-wallet.conf:/run/secrets/xmr-wallet.conf:ro
      - ./secrets/xmr-wallet-password:/run/secrets/xmr-wallet-password:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [xmr, xmr-egress]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

networks:
  xmr:
    internal: true
  xmr-egress: {}
